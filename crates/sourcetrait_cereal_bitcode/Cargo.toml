[package]
name = "sourcetrait_cereal_bitcode"
description = "SourceTrait's fork of bitcode, a bitwise binary serializer, with a budgeted decode"
version = "0.0.0-1"
edition = "2021"
rust-version = "1.88"
authors.workspace = true
license = "AGPL-3.0-or-later AND MIT"
repository.workspace = true
homepage.workspace = true
exclude = ["fuzz/"]

[dependencies]
arrayvec = { version = "0.7", default-features = false, optional = true }
bitcode_derive = { package = "sourcetrait_cereal_bitcode_derive", version = "=0.0.0-1", path = "../sourcetrait_cereal_bitcode_derive", optional = true }
bytemuck = { version = "1.14", features = [ "min_const_generics", "must_cast" ] }
glam = { version = ">=0.21", default-features = false, optional = true }
rust_decimal = { version = "1.36", default-features = false, optional = true }
serde = { version = "1.0", default-features = false, features = [ "alloc" ], optional = true }
time = { version = "0.3", default-features = false, optional = true }
uuid = { version = "1.10", default-features = false, optional = true }

[dev-dependencies]
arrayvec = { version = "0.7", features = [ "serde" ] }
bincode = "1.3.3"
flate2 = "1.0.28"
glam = { version = "0.22", default-features = false, features = [ "rand" ] }
lz4_flex = { version = "0.13", default-features = false }
paste = "1.0.14"
rand = "0.8.5"
rand_chacha = "0.3.1"
serde = { version = "1.0", features = [ "derive" ] }

# zstd doesn't compile with miri big-endian. Upstream's crate, for the wire's
# differential, reads past its short slices, which Miri reports.
[target.'cfg(not(miri))'.dev-dependencies]
bitcode_upstream = { package = "bitcode", version = "=0.6.9" }
zstd = "0.13.0"

[features]
derive = [ "dep:bitcode_derive" ]
std = [ "serde?/std", "glam?/std", "arrayvec?/std" ]
# The unit tests and benches, which take a nightly toolchain as upstream's do.
nightly = []
default = [ "derive", "std" ]

[package.metadata.docs.rs]
features = [ "derive", "serde", "std" ]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }
