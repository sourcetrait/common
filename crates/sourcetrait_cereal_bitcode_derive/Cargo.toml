[package]
name = "sourcetrait_cereal_bitcode_derive"
description = "The derive of sourcetrait_cereal_bitcode's Encode and Decode"
version = "0.0.0-1"
edition = "2021"
rust-version = "1.70"
authors.workspace = true
license = "AGPL-3.0-or-later AND MIT"
